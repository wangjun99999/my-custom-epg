import xml.etree.ElementTree as ET
from datetime import datetime, timedelta
import requests

# 确保转换为中国时区（北京时间）
def adjust_programme_time(root, target_offset=8):
    """
    强制将所有节目时间转换为北京时间 (+0800)
    """
    for p in root.findall("programme"):
        for attr in ("start", "stop"):
            t = p.get(attr)
            if not t:
                continue

            # 原始格式 20250102030000 或 20250102030000 +0000
            base = t[:14]
            dt = datetime.strptime(base, "%Y%m%d%H%M%S")

            # 如果原来有时区，例如 +0200
            tz = None
            if len(t) > 14:
                tz_str = t[15:].replace("+", "").replace("-", "")
                tz = int(tz_str) / 100

            # 全部转为 UTC
            if tz is not None:
                dt = dt - timedelta(hours=tz)

            # 最后统一转为中国时间
            dt = dt + timedelta(hours=target_offset)

            p.set(attr, dt.strftime("%Y%m%d%H%M%S") + f" +{target_offset:04d}")

def get_raw_epg_data(url):
    """从 EPG 源获取数据"""
    response = requests.get(url)
    if response.status_code == 200:
        return ET.fromstring(response.content)
    else:
        print("获取 EPG 数据失败")
        return None

def main():
    # 获取原始 EPG 数据
    raw_epg_url = "https://epg.pw/xmltv/epg.xml"  # 根据你的需求替换源链接
    root = get_raw_epg_data(raw_epg_url)
    if root is None:
        print("无法获取 EPG 数据，脚本结束")
        return

    # 调整节目时间为中国时区
    adjust_programme_time(root, target_offset=8)

    # 保存生成的自定义 EPG 文件
    with open("custom_epg.xml", "wb") as f:
        ET.ElementTree(root).write(f)
    print("已生成自定义 EPG 文件：custom_epg.xml")

if __name__ == "__main__":
    main()

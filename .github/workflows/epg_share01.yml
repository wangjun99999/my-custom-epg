name: epg_share01

on:
  schedule:
    # UTC 21:30 = 北京时间 05:30
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run epg_share01 filter
        run: |
          python scripts/epg_share01_filter.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/epg_share01.xml output/epg_share01.xml.gz
          git commit -m "Update epg_share01 EPG" || exit 0
          git push

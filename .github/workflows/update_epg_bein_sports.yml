name: Update beIN Sports EPG

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 北京 05:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Grab beIN Sports EPG
        run: |
          bash bein_sports_grab.sh

      - name: Map channel IDs
        run: |
          python bein_sports_map_ids.py bein_sports_raw.xml bein_sports_mapped.xml

      - name: Fix timezone to +0800
        run: |
          python bein_sports_tz_fix.py bein_sports_mapped.xml epg_bein_sports.xml

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epg_bein_sports.xml
          git commit -m "Auto update beIN Sports EPG" || true
          git push

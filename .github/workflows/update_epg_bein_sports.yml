name: Update beIN SPORTS EPG

on:
  schedule:
    # 每天北京时间 05:30 运行（UTC 21:30）
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  update-bein-sports-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz

      - name: Create working folders
        run: |
          mkdir -p data
          mkdir -p output
          mkdir -p logs

      # ① 生成频道映射（从你贴的 XML 解析）
      - name: Build beIN channel mapping
        run: |
          python scripts/bein_sports_build_channels.py \
            --input data/bein_sports_channels.xml \
            --output data/bein_sports_channels.json

      # ② 抓取 beIN 官方 EPG API
      - name: Fetch beIN SPORTS raw EPG
        run: |
          python scripts/bein_sports_fetch_epg.py \
            --channels data/bein_sports_channels.json \
            --days 7 \
            --output data/bein_sports_raw.json

      # ③ 转换为 XMLTV
      - name: Convert to XMLTV
        run: |
          python scripts/bein_sports_epg_to_xmltv.py \
            --input data/bein_sports_raw.json \
            --channels data/bein_sports_channels.json \
            --timezone Asia/Shanghai \
            --output output/bein_sports_epg.xml

      # ④ 格式化 & 去重
      - name: Normalize XML
        run: |
          python scripts/bein_sports_cleanup_xml.py \
            --input output/bein_sports_epg.xml \
            --output output/bein_sports_epg.xml

      # ⑤ 生成 gzip（给 IPTV 用）
      - name: Compress
        run: |
          gzip -f output/bein_sports_epg.xml

      # ⑥ 提交到 GitHub
      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output/bein_sports_epg.xml.gz data/*.json logs || true
          git commit -m "beIN SPORTS EPG auto update $(date -u '+%Y-%m-%d %H:%M')" || exit 0
          git push

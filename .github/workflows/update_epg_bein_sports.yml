name: Update beIN Sports EPG

on:
  schedule:
    # UTC 21:30 = 北京时间 05:30
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fix shell script format
        run: |
          sed -i 's/\r$//' bein_sports_grab.sh
          chmod +x bein_sports_grab.sh

      - name: Grab beIN Sports EPG
        run: |
          ./bein_sports_grab.sh

      - name: Map channel IDs
        run: |
          python3 bein_sports_map_ids.py bein_sports_raw.xml bein_sports_mapped.xml

      - name: Fix timezone to +0800
        run: |
          python3 bein_sports_tz_fix.py bein_sports_mapped.xml epg_bein_sports.xml

      - name: Validate EPG output
        run: |
          if [ ! -s epg_bein_sports.xml ]; then
            echo "❌ epg_bein_sports.xml is empty – aborting"
            exit 1
          fi
          echo "✅ EPG file looks valid"

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epg_bein_sports.xml
          git commit -m "Auto update beIN Sports EPG" || true
          git push

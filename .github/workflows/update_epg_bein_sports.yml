name: Update beIN Sports EPG

on:
  schedule:
    # 北京时间每天 05:30 运行
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install lxml requests pytz

      # 1️⃣ 从 beinsports.com 抓官方 EPG（UUID 频道）
      - name: Grab beIN Sports EPG
        run: |
          chmod +x bein_sports_grab.sh
          ./bein_sports_grab.sh

      # 2️⃣ UUID → MENA IPTV频道ID 重新绑定
      - name: Relink UUID → beIN MENA channels
        run: |
          python3 bein_sports_uuid_relink.py bein_sports_raw.xml bein_sports_relinked.xml

      # 3️⃣ 时区统一为中国 +0800
      - name: Fix timezone to +0800
        run: |
          python3 bein_sports_tz_fix.py bein_sports_relinked.xml epg_bein_sports.xml

      # 4️⃣ 提交并推送到 GitHub
      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add epg_bein_sports.xml
          git commit -m "Auto update beIN Sports EPG" || echo "No changes"
          git push

name: Update Starzplay Sports EPG

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22 = 北京 06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run generator
        run: |
          python epg_starzplay-sports.py

      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add epg_starzplay-sports.xml
          git commit -m "Auto update Starzplay Sports EPG" || exit 0
          git push

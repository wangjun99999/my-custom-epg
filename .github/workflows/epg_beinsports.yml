name: beIN Sports EPG

on:
  schedule:
    # UTC 21:30 = 北京时间 05:30
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install epg-grabber and deps
        run: |
          npm install epg-grabber axios dayjs

      # 抓全区 beIN → output/epg_beinsports_raw.xml
      - name: Run beIN grabber
        run: node epg_beinsports_grab.js

      # 转为北京时间 → output/epg_beinsports.xml
      - name: Convert to Beijing Time
        run: python epg_beinsports_to_cst.py

      # 压缩
      - name: Gzip output
        run: gzip -f output/epg_beinsports.xml

      # 提交
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/epg_beinsports.xml.gz
          git commit -m "Update beIN Sports EPG" || exit 0
          git push

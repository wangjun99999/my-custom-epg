name: Update Abu Dhabi Sports EPG

on:
  schedule:
    # 每天北京时间 06:00 运行
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate Abu Dhabi Sports EPG
        run: |
          python epg_abudhabi.py
          ls -lh epg_abudhabi.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg_abudhabi.xml
          git commit -m "Auto update Abu Dhabi Sports EPG" || exit 0
          git push

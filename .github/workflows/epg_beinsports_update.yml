name: Update beIN Sports EPG

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install requests

      - name: Run beIN grab
        run: python epg_beinsports_grab.py

      - name: Relink & convert timezone
        run: |
          mkdir -p output
          python epg_beinsports_relink.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/epg_beinsports.xml
          git commit -m "Update beIN Sports EPG" || echo "No change"
          git push

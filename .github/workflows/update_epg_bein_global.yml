name: Update Global beIN EPG

on:
  schedule:
    - cron: "0 22 * * *"   # 北京时间 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install requests

      - name: Generate
        run: python epg_bein_global.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg_bein_global.xml
          git commit -m "Auto update Global beIN EPG" || exit 0
          git push
